            background-size: cover;
        }
        @keyframes float-heart {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .floating-heart {
            position: fixed;
            color: #fca5a5;
            pointer-events: none;
            z-index: 0;
            animation: float-heart 10s linear infinite;
